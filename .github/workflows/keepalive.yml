# Pings Supabase twice a week so the free-tier project never pauses
# from inactivity (pause threshold is ~7 idle days).
# The anon key is public by design — RLS enforces all access rules.
# Manual test: Actions tab → "Supabase keep-alive" → Run workflow.
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 6 * * 1,4" # Mon & Thu 06:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://nvliebngyufwrekmgzen.supabase.co/rest/v1/products?select=id&limit=1" \
            -H "apikey: sb_publishable_BPkGW1U84E-qeCJ5N7dChw_yk1cBzxN")
          echo "Supabase responded with HTTP $code"
          test "$code" = "200"
